name: Build Monexo Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ./android/gradlew || true

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace


      - name: Prepare APK Release Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Monexo-v1.0.apk || cp android/app/build/outputs/apk/*/*/*.apk output_apk/Monexo-v1.0.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monexo-APK
          path: output_apk/Monexo-v1.0.apk

      - name: Create GitHub Release with APK Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Monexo APK v1.0.${{ github.run_number }}
          body: |
            Automated Build for Monexo Web App (https://monexo.wiki/)
            Download the APK below and install on any Android phone.
          files: |
            output_apk/Monexo-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
