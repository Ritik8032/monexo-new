    <script>
      (function() {
        const _origParse = JSON.parse;
        JSON.parse = function(text, reviver) {
          if (text === undefined || text === null || text === "undefined" || text === "") {
            return [];
          }
          try {
            return _origParse(text, reviver);
          } catch (e) {
            return [];
          }
        };
      })();

      (function() {

      })();
      // Global Console Interceptor to suppress redundant navigation messages and other ignorable noise
      (function() {
        const suppressKeywords = [
          'avoided redundant navigation',
          'navigationduplicated',
          'navigation duplicated',
          'createroutererror',
          'createnavigationduplicatederror'
        ];
        function shouldSuppress(args) {
          const msg = args.map(arg => {
            try {
              if (arg && arg.message) return arg.message;
              if (arg && arg.reason && arg.reason.message) return arg.reason.message;
              return String(arg);
            } catch(e) {
              return '';
            }
          }).join(' ').toLowerCase();
          return suppressKeywords.some(keyword => msg.includes(keyword));
        }

        const originalError = console.error;
        console.error = function(...args) {
          if (shouldSuppress(args)) return;
          originalError.apply(console, args);
        };

        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (shouldSuppress(args)) return;
          originalWarn.apply(console, args);
        };
      })();

      // 0a. Global Fetch Interceptor to mock/sanitize failing external requests
      (function() {
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          let url = '';
          if (typeof input === 'string') {
            url = input;
          } else if (input instanceof URL) {
            url = input.href;
          } else if (input && typeof input === 'object' && input.url) {
            url = input.url;
          }

          if (url) {
            const lowerUrl = url.toLowerCase();
            // Mock ipapi request
            if (lowerUrl.indexOf('ipapi.tooripaindia.workers.dev') !== -1) {
              console.log("[Mock Fetch] Intercepted ipapi request");
              return Promise.resolve(new Response(JSON.stringify({ ip: "127.0.0.1" }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            // Mock TRON grid or TRC20 requests
            if (lowerUrl.indexOf('trongrid.io') !== -1 || lowerUrl.indexOf('/transactions/trc20') !== -1) {
              console.log("[Mock Fetch] Intercepted TRON grid/TRC20 request:", url);
              return Promise.resolve(new Response(JSON.stringify({ data: [], meta: { page_size: 0 } }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            // Catch-all for any other external domains to prevent them from causing uncaught Rejections
            if (lowerUrl.startsWith('http://') || lowerUrl.startsWith('https://')) {
              // Get current origin
              const origin = window.location.origin;
              if (!lowerUrl.startsWith(origin.toLowerCase())) {
                console.log("[Mock Fetch] Safe-guarding external fetch:", url);
                return Promise.resolve(new Response(JSON.stringify({ code: 0, msg: "success", data: {} }), {
                  status: 200,
                  headers: { 'Content-Type': 'application/json' }
                }));
              }
            }
          }
          return originalFetch.apply(this, arguments);
        };
      })();

      // 0. Global Error and Rejection Logging
      function isIgnorableError(msg, stack) {
        if (!msg) return true;
        const lowerMsg = String(msg).toLowerCase();
        const lowerStack = stack ? String(stack).toLowerCase() : '';
        function matches(str) {
          const lowerStr = str.toLowerCase();
          return lowerMsg.indexOf(lowerStr) !== -1 || lowerStack.indexOf(lowerStr) !== -1;
        }
        return (
          matches('failed to fetch') ||
          matches('load failed') ||
          matches('[object object]') ||
          matches('networkerror') ||
          matches('aborted') ||
          matches('timeout') ||
          matches('image load error') ||
          matches('load error') ||
          matches('script error') ||
          matches('avoided redundant navigation') ||
          matches('navigationduplicated') ||
          matches('navigation duplicated') ||
          matches('createroutererror') ||
          matches('createnavigationduplicatederror')
        );
      }

      window.addEventListener('error', function(e) {
        if (e.target && e.target !== window && (e.target.tagName || e.target.src || e.target.href)) {
          return; // Ignore asset loading errors
        }
        var errorInfo = {
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          stack: e.error ? e.error.stack : ''
        };
        if (isIgnorableError(errorInfo.message, errorInfo.stack)) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return;
        }
        console.error("GLOBAL ERROR CAPTURED:", errorInfo);
        fetch('/xxapi/client_error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(errorInfo)
        }).catch(err => console.error("Error logging failed:", err));
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var errorInfo = {
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled rejection',
          stack: e.reason ? e.reason.stack : ''
        };
        if (isIgnorableError(errorInfo.message, errorInfo.stack)) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return;
        }
        console.error("GLOBAL REJECTION CAPTURED:", errorInfo);

      // 2. High-fidelity Turnstile Loader & Callback
      (function() {
        // Global Brand Name Rewriter (Vivi Pay / Tiwara Pay / Flow Pay / Milas Pay -> Monexo Pay)
        const brandRegex = /vivi\s*pay|tiwara\s*pay|flow\s*pay|milas\s*pay|vivipay|tiwarapay|flowpay|milaspay|milas/gi;
        
        // Intercept fetch API responses
        const origFetch = window.fetch;
        if (origFetch) {
          window.fetch = async function(...args) {
            const res = await origFetch.apply(this, args);
            try {
              const clone = res.clone();
              const text = await clone.text();
              if (brandRegex.test(text)) {
                const newText = text.replace(brandRegex, "Monexo Pay");
                return new Response(newText, {
                  status: res.status,
                  statusText: res.statusText,
                  headers: res.headers
                });
              }
            } catch(e) {}
            return res;
          };
        }

        // Intercept XMLHttpRequest responses
        const origSend = XMLHttpRequest.prototype.send;
        if (origSend) {
          XMLHttpRequest.prototype.send = function(...args) {
            this.addEventListener('readystatechange', function() {
              if (this.readyState === 4 && this.responseText) {
                if (brandRegex.test(this.responseText)) {
                  try {
                    const newText = this.responseText.replace(brandRegex, "Monexo Pay");
                    Object.defineProperty(this, 'responseText', { value: newText, writable: true });
                    Object.defineProperty(this, 'response', { value: newText, writable: true });
                  } catch(e) {}
                }
              }
            });
            return origSend.apply(this, args);
          };
        }
      })();

          setTimeout(() => {

            }
            if (statusText) {
              statusText.textContent = 'Success!';
              statusText.style.color = '#22c55e';
            }
            if (typeof callback === 'function') {
              try {
                callback("mock-turnstile-token-" + siteKey);
              } catch(e) {
                console.error("[Turnstile] Callback error:", e);
              }
            }
          }, 600);
        }
        return "cf-widget-" + Date.now();
      };

      // Intercept and block non-essential third-party scripts
      const originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
      if (originalSrcDescriptor) {
        Object.defineProperty(HTMLScriptElement.prototype, 'src', {
          set(val) {
            if (val && typeof val === 'string') {
              const lowerVal = val.toLowerCase();
              if (
                lowerVal.indexOf('recaptcha') !== -1 ||
                lowerVal.indexOf('livechat') !== -1 ||

                lowerVal.indexOf('facebook') !== -1 ||
                lowerVal.indexOf('fbevents') !== -1
              ) {
                console.log("Redirecting third-party script load to safe empty script:", val);
                originalSrcDescriptor.set.call(this, "data:text/javascript;base64,LyoqLw==");
                return;
              }
            }
            originalSrcDescriptor.set.call(this, val);
          },
          get() {
            return originalSrcDescriptor.get.call(this);
          },
          configurable: true
        });
      }

      // Pre-populate sessionStorage with Cloudflare Turnstile testing sitekey and slider captcha config
      try {
        const STORAGE_KEY = "xxapi_config_bundle_v1";
        sessionStorage.removeItem(STORAGE_KEY); // Clear stale cache
        console.log("[Setup] Pre-populating sessionStorage with Cloudflare Turnstile and Slider Captcha...");
        const defaultBody = {

    <script>
      // SPA Hash-Router safeguard: Convert direct path access like /buyinrdetail/... to /#/buyinrdetail/...
      (function() {
        const p = window.location.pathname;
        if (p.startsWith('/buyinr') || p.startsWith('/rechargeToken') || p.startsWith('/buyitokeninr')) {
          if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '#') {
            window.location.replace(window.location.origin + '/#' + p + window.location.search);
            return;
          }
        }
      })();

      // Support route handler: Prevent legacy app login redirects and handle public support chat
      (function() {
        const path = window.location.pathname.toLowerCase();
        const search = window.location.search.toLowerCase();
        const isSupportRoute = path.startsWith('/support') || search.includes('token=') || search.includes('session=');
        const isAdminRoute = path.startsWith('/admin');

        if (isSupportRoute || isAdminRoute) {
          const style = document.createElement('style');
          style.innerHTML = '#app { display: none !important; visibility: hidden !important; opacity: 0 !important; }';
          document.head.appendChild(style);
        } else {
          // Load main Monexo app script bundle
          const script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = '';
          script.src = '/assets/index.7e476b48.js';
          document.head.appendChild(script);
        }
      })();
