    <script>
      (function() {

          if (text === undefined || text === null || text === "undefined" || text === "") {

          } catch (e) {

      // Global Console Interceptor to suppress redundant navigation messages and other ignorable noise
      (function() {
        const suppressKeywords = [
          'avoided redundant navigation',
          'navigationduplicated',
          'navigation duplicated',
          'createroutererror',
          'createnavigationduplicatederror'
        ];
        function shouldSuppress(args) {
          const msg = args.map(arg => {
            try {
              if (arg && arg.message) return arg.message;
              if (arg && arg.reason && arg.reason.message) return arg.reason.message;
              return String(arg);
            } catch(e) {
              return '';
            }
          }).join(' ').toLowerCase();
          return suppressKeywords.some(keyword => msg.includes(keyword));
        }

        const originalError = console.error;
        console.error = function(...args) {
          if (shouldSuppress(args)) return;
          originalError.apply(console, args);
        };

        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (shouldSuppress(args)) return;
          originalWarn.apply(console, args);
        };
      })();

      // 0a. Global Fetch Interceptor to mock/sanitize failing external requests
      (function() {
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          let url = '';
          if (typeof input === 'string') {
            url = input;
          } else if (input instanceof URL) {
            url = input.href;
          } else if (input && typeof input === 'object' && input.url) {
            url = input.url;
          }

          if (url) {
            const lowerUrl = url.toLowerCase();
            // Mock ipapi request
            if (lowerUrl.indexOf('ipapi.tooripaindia.workers.dev') !== -1) {
              console.log("[Mock Fetch] Intercepted ipapi request");
              return Promise.resolve(new Response(JSON.stringify({ ip: "127.0.0.1" }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            // Mock TRON grid or TRC20 requests
            if (lowerUrl.indexOf('trongrid.io') !== -1 || lowerUrl.indexOf('/transactions/trc20') !== -1) {
              console.log("[Mock Fetch] Intercepted TRON grid/TRC20 request:", url);
              return Promise.resolve(new Response(JSON.stringify({ data: [], meta: { page_size: 0 } }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            // Catch-all for any other external domains to prevent them from causing uncaught Rejections
            if (lowerUrl.startsWith('http://') || lowerUrl.startsWith('https://')) {
              // Get current origin
              const origin = window.location.origin;
              if (!lowerUrl.startsWith(origin.toLowerCase())) {
                console.log("[Mock Fetch] Safe-guarding external fetch:", url);
                return Promise.resolve(new Response(JSON.stringify({ code: 0, msg: "success", data: {} }), {
                  status: 200,
                  headers: { 'Content-Type': 'application/json' }
                }));
              }
            }
          }
          return originalFetch.apply(this, arguments);
        };
      })();

      // 0. Global Error and Rejection Logging
      function isIgnorableError(msg, stack) {
        if (!msg) return true;
        const lowerMsg = String(msg).toLowerCase();
        const lowerStack = stack ? String(stack).toLowerCase() : '';
        function matches(str) {
          const lowerStr = str.toLowerCase();
          return lowerMsg.indexOf(lowerStr) !== -1 || lowerStack.indexOf(lowerStr) !== -1;
        }
        return (
          matches('failed to fetch') ||
          matches('load failed') ||
          matches('[object object]') ||
          matches('networkerror') ||
          matches('aborted') ||
          matches('timeout') ||
          matches('image load error') ||
          matches('load error') ||
          matches('script error') ||
          matches('avoided redundant navigation') ||
          matches('navigationduplicated') ||
          matches('navigation duplicated') ||
          matches('createroutererror') ||
          matches('createnavigationduplicatederror')
        );
      }

      window.addEventListener('error', function(e) {
        if (e.target && e.target !== window && (e.target.tagName || e.target.src || e.target.href)) {
          return; // Ignore asset loading errors
        }
        var errorInfo = {
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          stack: e.error ? e.error.stack : ''
        };
        if (isIgnorableError(errorInfo.message, errorInfo.stack)) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return;
        }
        console.error("GLOBAL ERROR CAPTURED:", errorInfo);
        fetch('/xxapi/client_error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(errorInfo)
        }).catch(err => console.error("Error logging failed:", err));
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var errorInfo = {
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled rejection',
          stack: e.reason ? e.reason.stack : ''
        };
        if (isIgnorableError(errorInfo.message, errorInfo.stack)) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return;

        const forbiddenPhraseRegex = /monexo\s*p2p\s*trading\s*platform|p2p\s*trading\s*platform/gi;
        
        function sanitizeText(str) {
          if (!str || typeof str !== 'string') return str;
          let s = str;
          if (forbiddenPhraseRegex.test(s)) {
            s = s.replace(forbiddenPhraseRegex, "Monexo");

          if (brandRegex.test(s)) {
            s = s.replace(brandRegex, "Monexo Pay");
          }
          return s;
        }

        // DOM Sanitizer to permanently remove platform subtitle anywhere in the document
        function scrubDom(root) {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
          let node;
          while (node = walker.nextNode()) {
            if (node.nodeValue && forbiddenPhraseRegex.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue.replace(forbiddenPhraseRegex, "Monexo");
            }
          }
        }

        document.addEventListener('DOMContentLoaded', () => {
          scrubDom(document.body);
          const observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
              if (mutation.type === 'childList') {
                for (const addedNode of mutation.addedNodes) {
                  scrubDom(addedNode);
                }
              } else if (mutation.type === 'characterData') {
                if (mutation.target.nodeValue && forbiddenPhraseRegex.test(mutation.target.nodeValue)) {
                  mutation.target.nodeValue = mutation.target.nodeValue.replace(forbiddenPhraseRegex, "Monexo");

        window.addEventListener('hashchange', triggerFastBalanceSync);
        setInterval(triggerFastBalanceSync, 5000);

        // Intercept fetch API responses
        const origFetch = window.fetch;
        if (origFetch) {
          window.fetch = async function(...args) {
            const res = await origFetch.apply(this, args);
            try {
              const clone = res.clone();
              const text = await clone.text();
              const sanitized = sanitizeText(text);
              if (sanitized !== text) {
                return new Response(sanitized, {
                  status: res.status,
                  statusText: res.statusText,
                  headers: res.headers
                });
              }
            } catch(e) {}
            return res;
          };
        }

        // Intercept XMLHttpRequest responses
        const origSend = XMLHttpRequest.prototype.send;
        if (origSend) {
          XMLHttpRequest.prototype.send = function(...args) {
            this.addEventListener('readystatechange', function() {
              if (this.readyState === 4 && this.responseText) {
                const sanitized = sanitizeText(this.responseText);
                if (sanitized !== this.responseText) {
                  try {
                    Object.defineProperty(this, 'responseText', { value: sanitized, writable: true });
                    Object.defineProperty(this, 'response', { value: sanitized, writable: true });
                  } catch(e) {}
                }
              }
            });
            return origSend.apply(this, args);
          };
        }
      })();

        return "cf-widget-" + Date.now();

      // Intercept and block non-essential third-party scripts
      const originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
      if (originalSrcDescriptor) {

            originalSrcDescriptor.set.call(this, val);

      }

      // Pre-populate sessionStorage with Cloudflare Turnstile testing sitekey and slider captcha config
      try {

    <script>
      // Global OTP & Auth UI Management: Provider-specific OTP digit lengths & 120s timer
      (function() {
        let resendLockUntil = parseInt(localStorage.getItem('otp_resend_lock_until') || '0', 10);
        if (isNaN(resendLockUntil)) resendLockUntil = 0;

        function start120sResendTimer() {
          resendLockUntil = Date.now() + 120000;
          localStorage.setItem('otp_resend_lock_until', String(resendLockUntil));
        }

        function getProviderOtpLength(contextStr, isUpiPage, isAuthPage, isForgotPasswordPage) {
          const str = (contextStr || '').toLowerCase();
          
          if (str.includes('freecharge') || str.includes('free charge')) return 4;
          if (str.includes('phonepe business') || str.includes('phonepe_business') || str.includes('phonepebiz')) return 5;
          if (str.includes('phonepe') || str.includes('phone pe')) return 5;
          if (str.includes('paytm business') || str.includes('paythbusiness') || str.includes('paytm_business')) return 6;
          if (str.includes('paytm') || str.includes('mobikwik') || str.includes('navi') || str.includes('supermoney') || str.includes('bharatpe') || str.includes('business')) return 6;
          
          if (isAuthPage) return 4;
          if (isForgotPasswordPage) return 6;
          if (isUpiPage) return 6; // Default to 6 digits for Paytm and all other tools
          return 6;
        }

        let isAdjusting = false;

        function adjustOtpAndAuthUi() {
          if (isAdjusting) return;
          isAdjusting = true;
          try {
            const hash = (window.location.hash || '').toLowerCase();
            const isAuthPage = hash.includes('login') || hash.includes('/rs') || hash.includes('register');
            const isForgotPasswordPage = hash.includes('editpassword') || hash.includes('resetpassword') || hash.includes('forgot');
            const isUpiPage = hash.includes('authupi') || hash.includes('link') || hash.includes('kyc') || hash.includes('collectiontool') || hash.includes('sell') || (!isAuthPage && !isForgotPasswordPage);

            const now = Date.now();
            const remainingSec = Math.max(0, Math.ceil((resendLockUntil - now) / 1000));

            // Walk Vue component tree to configure component properties
            const appEl = document.getElementById('app');
            if (appEl && appEl.__vue__) {
              function walkComponents(vm) {
                if (!vm) return;
                const name = (vm.$options && vm.$options.name) || '';
